[versions]
androidDesugarJdkLibs = "1.1.5"
androidGradlePlugin = "7.0.4"
androidxActivity = "1.4.0"
androidxAppCompat = "1.3.0"
androidxCore = "1.7.0"
androidxLifecycle = "2.4.0"
androidxPaging = "3.1.0"
fragment-ktx = "1.5.5"
recyclerView = "1.2.1"
constraintLayout = "2.1.2"
kotlin = "1.6.0"
kotlinxCoroutines = "1.6.0"
ktlint = "0.43.0"
material = "1.7.0"
spotless = "6.0.0"
kotlinSerializationPlugin = "1.6.0"
kotlixSerializationJson = "1.2.2"
retrofit = "2.9.0"
okHttp = "4.10.0"
interceptor = "4.10.0"
serialization-json = "1.3.3"
serialization-converter = "0.8.0"
coordinator-layout = "1.2.0"
dagger = "2.44"
junit="4.13.2"
core-testing = "1.1.1"
android-junit = "1.1.4"
android-testing-core = "3.5.0"
android-dagger-testing = "2.44"
kotlin-coroutines-testing = "1.6.4"
android-mockk = "1.12.0"
stateflow-testing = "0.11.0"
image-loader = "2.2.2"
navigation = "2.5.3"

[libraries]
#Android
android-desugarJdkLibs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "androidDesugarJdkLibs" }
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "androidGradlePlugin" }
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "androidxActivity" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "androidxAppCompat" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewModel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "androidxLifecycle" }
androidx-fragment-ktx = {group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragment-ktx"}
androidx-paging-common-ktx = { group = "androidx.paging", name = "paging-common-ktx", version.ref = "androidxPaging" }
androidx-paging-runtime-ktx = { group = "androidx.paging", name = "paging-runtime-ktx", version.ref = "androidxPaging" }
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerView" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintLayout" }
androidx-coordinator-layout = { group = "androidx.coordinatorlayout", name = "coordinatorlayout", version.ref = "coordinator-layout"}
google-material = { group = "com.google.android.material", name = "material", version.ref = "material" }
#Http Client
android-retrofit = {group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit"}
android-okhttp = {group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okHttp" }
android-interceptor = {group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "interceptor"}
#Kotlin Serialization
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlin-serializationPlugin = { group = "org.jetbrains.kotlin", name = "kotlin-serialization", version.ref = "kotlinSerializationPlugin" }
kotlinx-serialization = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlixSerializationJson"}
android-serialization-json = {group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization-json"}
android-serialization-converter = {group = "com.jakewharton.retrofit", name = "retrofit2-kotlinx-serialization-converter", version.ref = "serialization-converter"}
#Dependency Injectation
dagger-gradlePlugin = {group = "com.google.dagger", name = "hilt-android-gradle-plugin", version.ref = "dagger" }
android-dagger-hilt = {group = "com.google.dagger", name = "hilt-android", version.ref = "dagger" }
android-dagger-compiler = {group = "com.google.dagger", name = "hilt-compiler", version.ref = "dagger" }
#Test
junit = {group = "junit", name = "junit", version.ref = "junit" }
android-core-testing = {group = "android.arch.core", name = "core-testing", version.ref = "core-testing" }
android-junit = {group = "androidx.test.ext", name = "junit", version.ref = "android-junit" }
android-espresso-core = {group = "androidx.test.espresso", name = "espresso-core", version.ref = "android-testing-core" }
android-dagger-testing = {group = "com.google.dagger", name = "hilt-android-testing", version.ref = "android-dagger-testing" }
android-coroutines-testing = {group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlin-coroutines-testing" }
android-mockk = {group = "io.mockk", name = "mockk", version.ref = "android-mockk" }
android-stateflow-testing-turbine = {group = "app.cash.turbine", name = "turbine", version.ref = "stateflow-testing" }
#Image Loader
coil-image-loader = {group = "io.coil-kt", name = "coil", version.ref = "image-loader" }
#Navigation
navigation-fragment = {group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "navigation" }
navigation-ui = {group = "androidx.navigation", name = "navigation-ui-ktx", version.ref = "navigation" }